#
# MuliOS ISO build pacman configuration
# The build script replaces @MULIOS_PACKAGE_REPO@ with the checkout's package directory.
#
[options]
HoldPkg = pacman glibc
Architecture = auto
Color
ILoveCandy
ParallelDownloads = 10
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[mulios]
SigLevel = Optional TrustAll
Server = @MULIOS_PACKAGE_REPO@

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
