LABEL arch
TEXT HELP
Boot MuliOS 26.10.20-indev.11 on BIOS.
Start the MuliOS live environment and installer.
ENDTEXT
MENU LABEL MuliOS 26.10.20-indev.11 (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-mulios-generic
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-mulios-generic.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%

LABEL archspeech
TEXT HELP
Boot MuliOS 26.10.20-indev.11 on BIOS with speech support.
ENDTEXT
MENU LABEL MuliOS 26.10.20-indev.11 (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-mulios-generic
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-mulios-generic.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on
