LABEL arch
TEXT HELP
Boot MuliOS @MULIOS_VERSION@ on BIOS.
Start the MuliOS live environment and installer.
ENDTEXT
MENU LABEL MuliOS @MULIOS_VERSION@ (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-mulios-generic
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-mulios-generic.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G

LABEL archspeech
TEXT HELP
Boot MuliOS @MULIOS_VERSION@ on BIOS with speech support.
ENDTEXT
MENU LABEL MuliOS @MULIOS_VERSION@ (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-mulios-generic
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-mulios-generic.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G accessibility=on
