LABEL arch
TEXT HELP
Boot MuliOS @MULIOS_VERSION@ on BIOS.
Start the MuliOS live environment and installer.
ENDTEXT
MENU LABEL MuliOS @MULIOS_VERSION@ (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-mulios
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-mulios.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0

LABEL archspeech
TEXT HELP
Boot MuliOS @MULIOS_VERSION@ on BIOS with speech support.
ENDTEXT
MENU LABEL MuliOS @MULIOS_VERSION@ (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-mulios
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-mulios.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G accessibility=on quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0
