APPEND archisobasedir=%INSTALL_DIR% archiso_nfs_srv=${pxeserver}:/run/archiso/bootmnt cms_verify=y quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0
SYSAPPEND 3 quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0

