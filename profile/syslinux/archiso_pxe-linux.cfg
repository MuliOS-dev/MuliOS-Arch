LABEL arch_nbd
TEXT HELP
Boot the Arch Linux install medium using NBD.
It allows you to install Arch Linux or perform system maintenance.
ENDTEXT
MENU LABEL Arch Linux install medium (%ARCH%, NBD)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-mulios
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-mulios.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archiso_nbd_srv=${pxeserver} cms_verify=y quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0
SYSAPPEND 3 quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0

LABEL arch_nfs
TEXT HELP
