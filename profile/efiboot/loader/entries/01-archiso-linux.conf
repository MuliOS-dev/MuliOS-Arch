title    MuliOS @MULIOS_VERSION@ (%ARCH%, UEFI)
sort-key 01
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-mulios
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-mulios.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0
