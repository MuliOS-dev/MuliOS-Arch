#
# /etc/pacman.conf
# Runtime pacman configuration for installed and live MuliOS systems.
#

[options]
Architecture = auto
HoldPkg = pacman glibc
Color
ILoveCandy
ParallelDownloads = 10
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
