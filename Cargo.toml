[workspace]
resolver = "2"
members = ["rust/crates/mulios-core", "rust/apps/muliosctl"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/MuliOS-dev/MuliOS-Arch"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
